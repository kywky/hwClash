name: Build HAP

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.0.0.858
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Show toolchain versions
        run: |
          which hvigorw || true
          hvigorw -v || true
          ohpm --version || true
          node --version

      - name: Set up bootstrap Go for OHOS toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('core/go.sum') }}
          restore-keys: go-mod-

      - name: Test Go core (host)
        run: |
          export GOPROXY=https://goproxy.cn,direct
          cd core
          go test -tags with_gvisor ./...

      - name: Cache OHOS Go toolchain
        uses: actions/cache@v4
        with:
          path: ~/go-ohos
          key: go-ohos-${{ runner.os }}-${{ runner.arch }}-wefuture-tlsgd-v2

      - name: Build OHOS Go toolchain
        run: |
          if [ ! -x "$HOME/go-ohos/bin/go" ]; then
            git clone --depth 1 -b feature/tlsgd_mode_support \
              https://gitee.com/wefuture/golang_go.git "$RUNNER_TEMP/go-ohos-src"
            (cd "$RUNNER_TEMP/go-ohos-src/src" && GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash)
            mv "$RUNNER_TEMP/go-ohos-src" "$HOME/go-ohos"
          fi
          "$HOME/go-ohos/bin/go" version

      - name: Build Go proxy core
        run: |
          export GO_OHOS="$HOME/go-ohos/bin/go"
          export OHOS_NATIVE_HOME="${OHOS_NDK_HOME:-$HOME/ohos-sdk/command-line-tools/sdk/default/openharmony}/native"
          export GOPROXY=https://goproxy.cn,direct
          ./core/build.sh

      - name: Install dependencies
        run: ohpm install --all

      - name: Build HAP
        run: |
          hvigorw --mode module \
            -p product=default \
            -p module=entry@default \
            -p buildMode=release \
            assembleHap \
            --analyze=normal --parallel --incremental --no-daemon

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwclash-hap
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: error
          retention-days: 14

      - name: Check signing secret
        id: signcheck
        env:
          HAS_BUNDLE: ${{ secrets.HWCLASH_SIGNING_BUNDLE != '' }}
        run: |
          if [ "$HAS_BUNDLE" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HWCLASH_SIGNING_BUNDLE not configured, publishing unsigned HAP only."
          fi

      - name: Set up Java for signing
        if: ${{ steps.signcheck.outputs.enabled == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sign HAP and build signed APP
        if: ${{ steps.signcheck.outputs.enabled == 'true' }}
        env:
          SIGNING_BUNDLE: ${{ secrets.HWCLASH_SIGNING_BUNDLE }}
        run: |
          git clone --depth 1 https://github.com/openharmony/developtools_hapsigner.git "$RUNNER_TEMP/hapsigner"
          SIGNTOOL="$RUNNER_TEMP/hapsigner/dist/hap-sign-tool.jar"
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/bundle.tar.gz"
          mkdir -p "$RUNNER_TEMP/signing"
          tar xzf "$RUNNER_TEMP/bundle.tar.gz" -C "$RUNNER_TEMP/signing"
          STORE_PWD="$(cat "$RUNNER_TEMP/signing/keystore.password")"

          # 1. Sign the HAP (for direct side-loading).
          java -jar "$SIGNTOOL" sign-app \
            -keyAlias "hwclash-debug" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile "$RUNNER_TEMP/signing/tools.cer" \
            -profileFile "$RUNNER_TEMP/signing/toolsRelease.p7b" \
            -keystoreFile "$RUNNER_TEMP/signing/hwclash.p12" \
            -keystorePwd "$STORE_PWD" \
            -inFile entry/build/default/outputs/default/entry-default-unsigned.hap \
            -outFile entry/build/default/outputs/default/hwclash-signed.hap

          # 2. Repack the App Pack with the signed HAP, then sign the .app
          #    (AppGallery Connect requires the .app, not a bare HAP).
          hvigorw --mode project -p product=default -p buildMode=release assembleApp --no-daemon
          cp entry/build/default/outputs/default/hwclash-signed.hap "$RUNNER_TEMP/entry-default.hap"
          cp build/outputs/default/hwClash-default-unsigned.app "$RUNNER_TEMP/hwclash-repack.app"
          (cd "$RUNNER_TEMP" && zip -q hwclash-repack.app entry-default.hap)
          java -jar "$SIGNTOOL" sign-app \
            -keyAlias "hwclash-debug" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile "$RUNNER_TEMP/signing/tools.cer" \
            -profileFile "$RUNNER_TEMP/signing/toolsRelease.p7b" \
            -keystoreFile "$RUNNER_TEMP/signing/hwclash.p12" \
            -keystorePwd "$STORE_PWD" \
            -inForm "zip" \
            -inFile "$RUNNER_TEMP/hwclash-repack.app" \
            -outFile build/outputs/default/hwClash-signed.app
          java -jar "$SIGNTOOL" verify-app \
            -inFile build/outputs/default/hwClash-signed.app \
            -outCertChain "$RUNNER_TEMP/verify.cer" \
            -outProfile "$RUNNER_TEMP/verify.p7b"
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/bundle.tar.gz" "$RUNNER_TEMP/entry-default.hap" \
            "$RUNNER_TEMP/hwclash-repack.app" "$RUNNER_TEMP/verify.cer" "$RUNNER_TEMP/verify.p7b"

      - name: Upload signed artifacts
        if: ${{ steps.signcheck.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hwclash-release
          path: |
            entry/build/default/outputs/default/hwclash-signed.hap
            build/outputs/default/hwClash-signed.app
          if-no-files-found: error
          retention-days: 30
