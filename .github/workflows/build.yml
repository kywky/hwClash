name: Build HAP

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.0.0.858
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Show toolchain versions
        run: |
          which hvigorw || true
          hvigorw -v || true
          ohpm --version || true
          node --version

      - name: Set up bootstrap Go for OHOS toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('core/go.sum') }}
          restore-keys: go-mod-

      - name: Test Go core (host)
        run: |
          export GOPROXY=https://goproxy.cn,direct
          cd core
          go test -tags with_gvisor ./...

      - name: Cache OHOS Go toolchain
        uses: actions/cache@v4
        with:
          path: ~/go-ohos
          key: go-ohos-${{ runner.os }}-${{ runner.arch }}-wefuture-tlsgd-v2

      - name: Build OHOS Go toolchain
        run: |
          if [ ! -x "$HOME/go-ohos/bin/go" ]; then
            git clone --depth 1 -b feature/tlsgd_mode_support \
              https://gitee.com/wefuture/golang_go.git "$RUNNER_TEMP/go-ohos-src"
            (cd "$RUNNER_TEMP/go-ohos-src/src" && GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash)
            mv "$RUNNER_TEMP/go-ohos-src" "$HOME/go-ohos"
          fi
          "$HOME/go-ohos/bin/go" version

      - name: Build Go proxy core
        run: |
          export GO_OHOS="$HOME/go-ohos/bin/go"
          export OHOS_NATIVE_HOME="${OHOS_NDK_HOME:-$HOME/ohos-sdk/command-line-tools/sdk/default/openharmony}/native"
          export GOPROXY=https://goproxy.cn,direct
          ./core/build.sh

      - name: Install dependencies
        run: ohpm install --all

      - name: Build HAP
        run: |
          hvigorw --mode module \
            -p product=default \
            -p module=entry@default \
            -p buildMode=release \
            assembleHap \
            --analyze=normal --parallel --incremental --no-daemon

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwclash-hap
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: error
          retention-days: 14

      - name: Check signing secrets
        id: signcheck
        env:
          HAS_P12: ${{ secrets.HWCLASH_P12 != '' }}
          HAS_CER: ${{ secrets.HWCLASH_CER != '' }}
          HAS_P7B: ${{ secrets.HWCLASH_P7B != '' }}
          HAS_PWD: ${{ secrets.HWCLASH_KEYSTORE_PWD != '' }}
        run: |
          if [ "$HAS_P12" = "true" ] && [ "$HAS_CER" = "true" ] && [ "$HAS_P7B" = "true" ] && [ "$HAS_PWD" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured, publishing unsigned HAP only."
          fi

      - name: Sign HAP
        if: ${{ steps.signcheck.outputs.enabled == 'true' }}
        env:
          HWCLASH_P12: ${{ secrets.HWCLASH_P12 }}
          HWCLASH_CER: ${{ secrets.HWCLASH_CER }}
          HWCLASH_P7B: ${{ secrets.HWCLASH_P7B }}
          HWCLASH_KEYSTORE_PWD: ${{ secrets.HWCLASH_KEYSTORE_PWD }}
        run: |
          git clone --depth 1 https://github.com/openharmony/developtools_hapsigner.git "$RUNNER_TEMP/hapsigner"
          SIGNTOOL="$RUNNER_TEMP/hapsigner/dist/hap-sign-tool.jar"
          echo "$HWCLASH_P12" | base64 -d > "$RUNNER_TEMP/hwclash.p12"
          echo "$HWCLASH_CER" | base64 -d > "$RUNNER_TEMP/hwclash.cer"
          echo "$HWCLASH_P7B" | base64 -d > "$RUNNER_TEMP/hwclash.p7b"
          java -jar "$SIGNTOOL" sign-app \
            -keyAlias "hwclash-debug" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile "$RUNNER_TEMP/hwclash.cer" \
            -profileFile "$RUNNER_TEMP/hwclash.p7b" \
            -keystoreFile "$RUNNER_TEMP/hwclash.p12" \
            -keystorePwd "$HWCLASH_KEYSTORE_PWD" \
            -inFile entry/build/default/outputs/default/entry-default-unsigned.hap \
            -outFile entry/build/default/outputs/default/hwclash-signed.hap
          rm -f "$RUNNER_TEMP/hwclash.p12" "$RUNNER_TEMP/hwclash.cer" "$RUNNER_TEMP/hwclash.p7b"

      - name: Upload signed HAP artifact
        if: ${{ steps.signcheck.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hwclash-hap-signed
          path: entry/build/default/outputs/default/hwclash-signed.hap
          if-no-files-found: error
          retention-days: 30
